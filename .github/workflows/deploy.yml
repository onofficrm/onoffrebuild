name: Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: onoffrebuild-ftp-deploy
  cancel-in-progress: true

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          parallel: 1
          protocol: ftp
          local-dir: ./
          server-dir: /public_html/
          state-name: onoffrebuild-deploy-v1
          log-level: minimal
          exclude: |
            **/.git*
            **/.github/**
            **/.DS_Store
            **/.vscode/**
            **/._*
            _backup_transfer_*/
            **/_backup_transfer_*/
            _BUILDER_INPUT/**
            build/**
            data/dbconfig.php
            data/dbconfig.local.php
            data/icrm.config.php
            data/onoff_private_keys.php
            data/onoff-crm-contract.local.php
            data/cache/**
            data/session/**
            data/file/**
            data/log/**
            data/tmp/**
            cache/**
            session/**
            tmp/**
            *.log
            .env
            .env.*
            plugin/auto_comment/packages/**

      # exFAT 700 sync (esp. .htaccess) → Apache 403 on entire /seo-system-300/ tree
      - name: Fix seo-system-300 web permissions
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_REMOTE_ROOT: /public_html
        run: python3 scripts/ftp-chmod-tree.py seo-system-300
