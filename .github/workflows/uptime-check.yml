name: Production Access Uptime

# Manual only. Scheduled probes from GitHub runners can look like abuse to host WAFs.
# Symptom correlation: TCP timeout / edge 403 are hosting-edge, not app PHP.

on:
  workflow_dispatch:

concurrency:
  group: onoff-uptime-check
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe production access
        run: |
          chmod +x scripts/check-production-access.sh
          ./scripts/check-production-access.sh

      - name: Summarize failure guidance
        if: failure()
        run: |
          echo "::error::Public access failed. If status is 000/timeout or English Forbidden 403 on access-health.php, this is hosting edge/WAF — not GNUBoard/React. Do not redeploy to fix."
